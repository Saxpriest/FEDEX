<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FedEx Chat Admin Panel</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: Verdana, sans-serif;
      margin: 20px;
      background-color: #f8f8fc;
      color: #333;
    }
    h1 {
      color: #4f0a91;
      text-align: center;
    }
    .chat-container {
      max-width: 700px;
      margin: 30px auto;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 80vh;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 6px;
      background: #fafafa;
      margin-bottom: 15px;
    }
    .msg {
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .msg strong {
      color: #4f0a91;
    }
    .msg.admin strong {
      color: #ff6c00;
    }
    .reply-box {
      display: flex;
      gap: 10px;
    }
    .reply-box input {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .reply-box button {
      background: #4f0a91;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    .reply-box button:hover {
      background: #6e26c4;
    }
  </style>
</head>
<body>
  <h1>💬 FedEx Chat Admin Panel</h1>

  <div class="chat-container">
    <div class="messages" id="messages"></div>

    <div class="reply-box">
      <input type="text" id="replyInput" placeholder="Type your reply...">
      <button onclick="sendReply()">Send</button>
    </div>
  </div>

  <!-- Supabase JS -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    // Supabase setup
    const SUPABASE_URL = "https://ipecphnepjvaogyxxqfh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwZWNwaG5lcGp2YW9neXh4cWZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0MzA1MTIsImV4cCI6MjA3NTAwNjUxMn0.D9ySAcvy6V_Mf2HxHjGpLzbyespaPB0ckS2ZgvdwtYc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Load all messages
    async function loadMessages() {
      const { data, error } = await supabaseClient
        .from("messages")
        .select("*")
        .order("created_at", { ascending: true });

      if (error) {
        console.error("Error loading messages:", error);
        return;
      }

      const box = document.getElementById("messages");
      box.innerHTML = data.map(m => `
        <div class="msg ${m.sender.toLowerCase()}">
          <strong>${m.sender}:</strong> ${m.text} <br>
          <small style="color:#888;">${new Date(m.created_at).toLocaleString()}</small>
        </div>
      `).join("");
      box.scrollTop = box.scrollHeight;
    }

    // Send admin reply
    async function sendReply() {
      const input = document.getElementById("replyInput");
      const msg = input.value.trim();
      if (!msg) return;

      const { error } = await supabaseClient
        .from("messages")
        .insert([{ sender: "Admin", text: msg }]);

      if (error) {
        alert("Error sending reply: " + error.message);
        return;
      }

      input.value = "";
      loadMessages();
    }

    // Refresh every 3 seconds
    loadMessages();
    setInterval(loadMessages, 3000);
  </script>
</body>
</html>
