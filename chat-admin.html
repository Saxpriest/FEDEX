<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FedEx Chat Admin Panel</title>
  <style>
    body { font-family: Verdana, sans-serif; background:#f8f8fc; padding:20px; }
    .chat-container { max-width:700px; margin:auto; background:white; border-radius:10px; padding:20px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    .messages { border:1px solid #ddd; border-radius:6px; padding:10px; background:#fafafa; height:400px; overflow-y:auto; margin-bottom:15px; }
    .msg { margin-bottom:10px; }
    .msg strong { color:#4f0a91; }
    .msg.admin strong { color:#ff6c00; }
    .reply-box { display:flex; gap:10px; }
    .reply-box input[type=text]{flex:1;padding:8px;border-radius:5px;border:1px solid #ccc;}
    .reply-box button{background:#4f0a91;color:white;border:none;padding:8px 14px;border-radius:5px;cursor:pointer;}
    img.chat-image{max-width:140px;border-radius:8px;margin-top:5px;display:block;}
  </style>
</head>
<body>
  <h1 style="text-align:center;color:#4f0a91;">💬 FedEx Chat Admin Panel</h1>

  <div class="chat-container">
    <label><b>Select User:</b></label>
    <select id="userSelect" onchange="loadMessages()"></select>
    <div class="messages" id="messages"></div>

    <div class="reply-box">
      <input type="file" id="fileInput" style="display:none;" accept="image/*" onchange="sendFile(event)">
      <button onclick="document.getElementById('fileInput').click()">📎</button>
      <input type="text" id="replyInput" placeholder="Type your reply...">
      <button onclick="sendReply()">Send</button>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ipecphnepjvaogyxxqfh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwZWNwaG5lcGp2YW9neXh4cWZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk0MzA1MTIsImV4cCI6MjA3NTAwNjUxMn0.D9ySAcvy6V_Mf2HxHjGpLzbyespaPB0ckS2ZgvdwtYc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let selectedUser = null;

    async function loadUserList() {
      const { data, error } = await supabaseClient.from("messages").select("user_id").not("user_id", "is", null);
      if (error) return console.error(error);
      const uniqueUsers = [...new Set(data.map(u => u.user_id))];
      const select = document.getElementById("userSelect");
      select.innerHTML = uniqueUsers.map(u => `<option value="${u}">${u}</option>`).join("");
      if (!selectedUser && uniqueUsers.length > 0) selectedUser = uniqueUsers[0];
      loadMessages();
    }

    async function loadMessages() {
      selectedUser = document.getElementById("userSelect").value;
      if (!selectedUser) return;
      const { data, error } = await supabaseClient
        .from("messages")
        .select("*")
        .eq("user_id", selectedUser)
        .order("created_at", { ascending: true });

      if (error) return console.error(error);

      const box = document.getElementById("messages");
      box.innerHTML = data.map(m => {
        const cls = m.sender === "Admin" ? "msg admin" : "msg user";
        const filePart = m.file_url ? `<img src="${m.file_url}" class="chat-image">` : "";
        return `<div class="${cls}"><strong>${m.sender}:</strong> ${m.text || ""}${filePart}<br><small>${new Date(m.created_at).toLocaleString()}</small></div>`;
      }).join("");
      box.scrollTop = box.scrollHeight;
    }

    async function sendReply() {
      const input = document.getElementById("replyInput");
      const msg = input.value.trim();
      if (!msg || !selectedUser) return;
      await supabaseClient.from("messages").insert([{ user_id: selectedUser, sender: "Admin", text: msg }]);
      input.value = "";
      loadMessages();
    }

    async function sendFile(event) {
      const file = event.target.files[0];
      if (!file || !selectedUser) return;

      const filePath = `${selectedUser}/admin_${Date.now()}_${file.name}`;
      const { error: uploadError } = await supabaseClient.storage.from("chat_uploads").upload(filePath, file);
      if (uploadError) return alert("Upload failed: " + uploadError.message);

      const { data } = supabaseClient.storage.from("chat_uploads").getPublicUrl(filePath);
      await supabaseClient.from("messages").insert([{ user_id: selectedUser, sender: "Admin", text: "", file_url: data.publicUrl }]);
      loadMessages();
    }

    loadUserList();
    setInterval(loadMessages, 4000);
  </script>
</body>
</html>
