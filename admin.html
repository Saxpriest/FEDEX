<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FedEx Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { font-family: Verdana; margin: 20px; background: #f9f9f9; }
    h1 { color: purple; }
    form { display: flex; flex-direction: column; width: 300px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input, button { margin: 8px 0; padding: 8px; font-size: 14px; }
    button { background: #4f0a91; color: white; border: none; cursor: pointer; border-radius: 5px; }
    button:hover { background: #6523b3; }
  </style>
</head>
<body>
  <h1>Admin Dashboard</h1>

  <form id="shipmentForm">
    <input type="text" id="trackingNumber" placeholder="Tracking Number" readonly>
    <input type="text" id="origin" placeholder="Origin" required>
    <input type="text" id="destination" placeholder="Destination" required>
    <input type="text" id="status" placeholder="Status (e.g. In Transit)" required>
    <input type="date" id="deliveryDate" required>
    <button type="submit">Save Shipment</button>
  </form>

  <!-- ✅ Supabase Script -->
 <!-- Supabase Library -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://ogzzwegtifhtjygnsuxr.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nenp3ZWd0aWZodGp5Z25zdXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTEwMzIsImV4cCI6MjA4ODc2NzAzMn0.Hp7F2GDqfBeHxXKek3BkN_P1HAuqhab5jEogbaKygB8";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

// Generate random tracking number
document.getElementById("trackingNumber").value =
  "FDX" + Math.floor(Math.random() * 1000000000);

// Handle form submission
document.getElementById("shipmentForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const shipment = {
    tracking_number: document.getElementById("trackingNumber").value,
    origin: document.getElementById("origin").value,
    destination: document.getElementById("destination").value,
    status: document.getElementById("status").value,
    delivery_date: document.getElementById("deliveryDate").value
  };

  const { error } = await supabaseClient
    .from("shipments")
    .insert([shipment]);

  if (error) {
    alert("❌ Error: " + error.message);
  } else {
    alert("✅ Shipment Saved! Tracking Number: " + shipment.tracking_number);
    location.reload();
  }
});
</script>
</body>
</html>
